<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="description" content="CEO KnowledgeWeb Studioの本人用入口です。">
  <meta http-equiv="refresh" content="2;url=https://ceo-knowledgeweb.autopilot-note.com/">
  <title>生成画面を開く｜CEO KnowledgeWeb Studio</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <section class="panel" aria-labelledby="title">
      <span class="eyebrow">PRIVATE CREATION GATEWAY</span>
      <h1 id="title">人物サイトの<br>生成画面を開きます。</h1>
      <p class="lead">本人用アクセスコードでログインすると、外出先や別のPCから生成を開始できます。</p>
      <a class="button" id="open-app" href="https://ceo-knowledgeweb.autopilot-note.com/">生成画面を開く <span aria-hidden="true">→</span></a>
      <p class="status" id="status" role="status">2秒後に自動で移動します。移動しない場合は上のボタンを押してください。</p>
    </section>
    <aside aria-label="利用条件">
      <div><b>このPCが稼働中</b><span>生成処理は既存PCのCodexが実行します。</span></div>
      <div><b>本人用アクセス</b><span>生成画面ではアクセスコードによるログインが必要です。</span></div>
      <div><b>GitHubへ保存しない</b><span>入力PDFや案件データは、この入口には保存されません。</span></div>
    </aside>
  </main>
  <footer>CEO KnowledgeWeb Studio</footer>
</body>
</html>
